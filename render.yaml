# Render Blueprint: New → Blueprint → выбрать этот репозиторий.
# Бесплатный веб-сервис + внешняя бесплатная база PostgreSQL (Neon).
services:
  - type: web
    name: it-veche
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
